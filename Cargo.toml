[package]
name = "multi-monitor-brightness"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
description = "Keyboard-first brightness control for external monitors"
license = "MIT"
repository = "https://github.com/siarheisinelnikau/multi-monitor-brightness"
build = "build.rs"

[features]
# Opt-in developer capture; regular builds do not exit or save screenshots.
ui-capture = ["dep:png"]
tray-smoke-test = []
updater-smoke-test = []
render-smoke-test = []

[dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.37.0", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { path = "vendor/egui_software_backend", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
sha2 = "0.10.9"
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls-no-default"] }
png = { version = "0.18.1", optional = true }
tray-icon = { version = "=0.21.3", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The CPU rasterizer must also be usable in local debug previews.
[profile.dev.package.egui_software_backend]
opt-level = 3
