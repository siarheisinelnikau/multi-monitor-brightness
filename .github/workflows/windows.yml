name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Verify native executable update and restart
        run: ./scripts/test-updater.ps1
        shell: pwsh
      - run: ./scripts/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MultiMonitorBrightness-windows-x64
          path: |
            dist/MultiMonitorBrightness-v*.exe
            dist/SHA256SUMS.txt
            LICENSE
          if-no-files-found: error
