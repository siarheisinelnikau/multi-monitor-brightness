name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package version.' }
          $package = $metadata.packages | Where-Object name -eq 'multi-monitor-brightness'
          $tag = 'v' + $package.version
          if ($env:RELEASE_EVENT -eq 'push' -and $env:RELEASE_REF -notin @($tag, ('release/' + $tag))) {
            throw "Release ref does not match package version $tag."
          }
          if (-not (Test-Path -LiteralPath "release-notes/$tag.md")) { throw 'Release notes missing.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Verify native executable update and restart
        run: ./scripts/test-updater.ps1
        shell: pwsh
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Publish executable and checksum
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            try {
              const {data: reference} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (reference.object.type !== 'commit' || reference.object.sha !== context.sha) {
                throw new Error('An existing version tag belongs to another commit.');
              }
            } catch (error) { if (error.status !== 404) throw error; }
            const executable = `MultiMonitorBrightness-${tag}.exe`;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft || release.target_commitish !== context.sha) {
                throw new Error('An existing release will not be overwritten.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Multi-Monitor Brightness ${tag}`, draft: true, prerelease: false,
                body: fs.readFileSync(`release-notes/${tag}.md`, 'utf8')
              })).data;
            }
            for (const [path, name] of [
              [`dist/${executable}`, executable],
              ['dist/SHA256SUMS.txt', 'SHA256SUMS.txt'],
              ['LICENSE', 'LICENSE'],
              ['THIRD_PARTY_NOTICES.txt', 'THIRD_PARTY_NOTICES.txt']
            ]) {
              const data = fs.readFileSync(path);
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) {
                if (existing.digest !== digest) throw new Error(`Asset ${name} differs; refusing to overwrite.`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            const published = (await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: 'true'
            })).data;
            core.notice(`Published ${published.html_url}`);
