name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - run: cargo fmt --check
    - run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - run: cargo test --locked
    - name: Verify native executable update and restart
      run: ./scripts/test-updater.ps1
      shell: pwsh
    - run: ./scripts/build.ps1
      shell: pwsh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: MultiMonitorBrightness-windows-x64
        path: |
          dist/MultiMonitorBrightness-v*.exe
          dist/SHA256SUMS.txt
          LICENSE
          THIRD_PARTY_NOTICES.txt
        if-no-files-found: error
    permissions:
      contents: read
    timeout-minutes: 30
